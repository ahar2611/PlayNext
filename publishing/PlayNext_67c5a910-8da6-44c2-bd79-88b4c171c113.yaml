Type: Generic
Name: 'PlayNext'
Author: 'Lanney'
ShortDescription: "Can't decide what to play? PlayNext looks at your library and picks what to play next, with a quick reason for each pick."
Description: |
  PlayNext goes through your Playnite library and picks what you should play next. It looks at how much you've played each game, what you finished, what you gave up on, your favorites and the genres you keep coming back to, then gives you a ranked list with a short reason for every pick.

  There's an Overall list and lists for Story-rich, RPGs, Action, Cozy & Chill, Strategy, Horror, short games and multiplayer, and you can change those categories however you want. Every pick is tagged as something new, something to continue, or an old favorite worth revisiting, and shows HowLongToBeat times (using the HowLongToBeat add-on's data if you have it).

  The "Your playstyle" page sums up how you play: whether you finish what you start, how long your games usually are, where your hours go and how big your backlog has gotten.

  Open it from Playnite's sidebar or from the icon next to your clock. Works with a free Google Gemini key, Anthropic Claude, or an offline mode that needs no key. Your key stays encrypted on your PC.
